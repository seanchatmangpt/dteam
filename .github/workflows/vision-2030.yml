name: vision-2030

on:
  pull_request:
    paths:
      - "capabilities/dteam-kernel/src/phase_change.rs"
      - "capabilities/dteam-kernel/src/bin/dteam-doctor.rs"
      - "capabilities/dteam-kernel/src/lib.rs"
      - "capabilities/dteam-kernel/Cargo.toml"
      - ".github/workflows/vision-2030.yml"

concurrency:
  group: vision-2030-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      MANIFEST: capabilities/dteam-kernel/Cargo.toml
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4
      - name: Type-check doctor surface
        run: cargo check --manifest-path "$MANIFEST" --bin dteam-doctor
      - name: Execute control-plane tests
        run: cargo test --manifest-path "$MANIFEST" phase_change::tests -- --test-threads=1
      - name: Manufacture Vision 2030 evidence
        shell: bash
        run: |
          mkdir -p artifacts/vision-2030
          cargo run --quiet --manifest-path "$MANIFEST" --bin dteam-doctor -- --json > artifacts/vision-2030/doctor.json
          cargo run --quiet --manifest-path "$MANIFEST" --bin dteam-doctor -- graph > artifacts/vision-2030/graph.txt
          cargo run --quiet --manifest-path "$MANIFEST" --bin dteam-doctor -- repair > artifacts/vision-2030/repair.txt
          cargo run --quiet --manifest-path "$MANIFEST" --bin dteam-doctor -- qol prove > artifacts/vision-2030/qol-prove.txt
          set +e
          cargo run --quiet --manifest-path "$MANIFEST" --bin dteam-doctor -- crown > artifacts/vision-2030/crown.txt
          crown_exit=$?
          set -e
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/vision-2030")
          doctor = json.loads((root / "doctor.json").read_text())
          files = {}
          for path in sorted(root.iterdir()):
              files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {
              "schema": "urn:dteam:vision-2030-receipt:v1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "sha": os.environ.get("GITHUB_SHA"),
              "standing": doctor["standing"],
              "score": doctor["score"],
              "doctor_digest": doctor["digest"],
              "files": files,
          }
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          test "$crown_exit" -eq 3
      - name: Upload Vision 2030 receipt
        uses: actions/upload-artifact@v4
        with:
          name: vision-2030-evidence
          path: artifacts/vision-2030
          if-no-files-found: error
