name: closure

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  source-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify closure capabilities
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Verify repository source closure
        run: python tools/verify_repository.py --root .
      - name: Compile capability ledger
        run: python tools/capability_ledger.py --root . --output artifacts/capability-ledger.json
      - name: Upload capability ledger
        uses: actions/upload-artifact@v4
        with:
          name: capability-ledger
          path: artifacts/capability-ledger.json
          if-no-files-found: error
