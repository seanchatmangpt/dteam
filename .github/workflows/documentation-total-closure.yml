name: documentation-total-closure

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: documentation-total-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  close-markdown:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/documentation-total-closure'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test closure engine
        run: python -m unittest tools.tests.test_documentation_closure -v
      - name: Rewrite or archive every Markdown file
        run: python tools/documentation_closure.py --root . --apply
      - name: Verify documentation closure
        run: python tools/documentation_closure.py --root . --check
      - name: Commit manufactured documentation closure
        run: |
          git config user.name "dteam-documentation-closure"
          git config user.email "dteam-documentation-closure@users.noreply.github.com"
          git add -A
          git add -f docs/MARKDOWN_INVENTORY.json docs/DOCUMENTATION_CLOSURE.json
          if git diff --cached --quiet; then
            echo "documentation closure already stable"
            exit 0
          fi
          git commit -m "docs: stabilize complete markdown closure"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Publish receipt summary
        if: always()
        run: |
          test -f docs/DOCUMENTATION_CLOSURE.json && cat docs/DOCUMENTATION_CLOSURE.json || true
